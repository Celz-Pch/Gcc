<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDFs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
      color: #1a1a2e;
    }
    h1 { font-size: 2rem; margin-bottom: 2rem; }
    .list { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .icon { font-size: 1.75rem; flex-shrink: 0; }
    .name { flex: 1; font-size: .95rem; word-break: break-all; }
    .btn {
      background: #4f46e5;
      color: #fff;
      text-decoration: none;
      padding: .5rem 1rem;
      border-radius: 8px;
      font-size: .875rem;
      white-space: nowrap;
      transition: background .15s;
    }
    .btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <h1>📂 Documents PDF</h1>
  <div class="list">
    <div class="card">
      <span class="icon">📄</span>
      <span class="name">Epitech - WinterCamp - Atelier analyse.pdf</span>
      <a class="btn" href="/pdfs/Epitech%20-%20WinterCamp%20-%20Atelier%20analyse.pdf" download="Epitech - WinterCamp - Atelier analyse.pdf">Télécharger</a>
    </div>
    <div class="card">
      <span class="icon">📄</span>
      <span class="name">Epitech - WinterCamp - Atelier prédiction.pdf</span>
      <a class="btn" href="/pdfs/Epitech%20-%20WinterCamp%20-%20Atelier%20pr%C3%A9diction.pdf" download="Epitech - WinterCamp - Atelier prédiction.pdf">Télécharger</a>
    </div>
    <div class="card">
      <span class="icon">📄</span>
      <span class="name">Epitech - WinterCamp - Atelier starter.pdf</span>
      <a class="btn" href="/pdfs/Epitech%20-%20WinterCamp%20-%20Atelier%20starter.pdf" download="Epitech - WinterCamp - Atelier starter.pdf">Télécharger</a>
    </div>
    <div class="card">
      <span class="icon">📄</span>
      <span class="name">Epitech - WinterCamp - Infographie.pdf</span>
      <a class="btn" href="/pdfs/Epitech%20-%20WinterCamp%20-%20Infographie.pdf" download="Epitech - WinterCamp - Infographie.pdf">Télécharger</a>
    </div>
  </div>
</body>
</html>
